<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Getekende avatar van Merel Aerts">
  <title>Merel Aerts — illustratie</title>
  <circle cx="100" cy="100" r="100" fill="#0E7C86"/>
  <circle cx="100" cy="100" r="100" fill="url(#bgGradient)"/>
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12939E"/>
      <stop offset="1" stop-color="#0A5D65"/>
    </linearGradient>
  </defs>

  <!-- neck -->
  <path d="M84 132 L84 156 Q100 168 116 156 L116 132 Z" fill="#E8A579"/>

  <!-- shoulders / top -->
  <path d="M46 200 C46 165 70 148 100 148 C130 148 154 165 154 200 Z" fill="#FF6B4A"/>

  <!-- hair back -->
  <path d="M56 96 C56 54 76 34 100 34 C124 34 144 54 144 96 C144 118 138 138 132 148 C128 130 128 108 128 100 C128 78 116 66 100 66 C84 66 72 78 72 100 C72 108 72 130 68 148 C62 138 56 118 56 96 Z" fill="#5B3A29"/>

  <!-- face -->
  <ellipse cx="100" cy="100" rx="38" ry="42" fill="#F0B98A"/>

  <!-- ears -->
  <circle cx="63" cy="102" r="7" fill="#F0B98A"/>
  <circle cx="137" cy="102" r="7" fill="#F0B98A"/>

  <!-- hair front / fringe -->
  <path d="M62 92 C62 64 78 46 100 46 C122 46 138 64 138 92 C130 78 118 70 100 70 C82 70 70 78 62 92 Z" fill="#5B3A29"/>
  <path d="M62 92 C66 82 72 76 80 72 C76 80 74 88 74 96 Z" fill="#6C4630"/>
  <path d="M138 92 C134 82 128 76 120 72 C124 80 126 88 126 96 Z" fill="#6C4630"/>

  <!-- eyebrows -->
  <path d="M79 92 Q86 87 93 91" stroke="#4A2E20" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M107 91 Q114 87 121 92" stroke="#4A2E20" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- eyes -->
  <circle cx="86" cy="101" r="4.2" fill="#2B2B2B"/>
  <circle cx="114" cy="101" r="4.2" fill="#2B2B2B"/>

  <!-- blush -->
  <circle cx="78" cy="114" r="6" fill="#F49A78" opacity="0.55"/>
  <circle cx="122" cy="114" r="6" fill="#F49A78" opacity="0.55"/>

  <!-- nose -->
  <path d="M99 103 Q97 111 100 113" stroke="#D89568" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- smile -->
  <path d="M85 120 Q100 132 115 120" stroke="#8A4B32" stroke-width="3.4" fill="none" stroke-linecap="round"/>

  <!-- sunglasses pushed up on hair -->
  <g>
    <rect x="70" y="58" width="26" height="14" rx="7" fill="#16231F" opacity="0.9"/>
    <rect x="104" y="58" width="26" height="14" rx="7" fill="#16231F" opacity="0.9"/>
    <path d="M96 65 Q100 61 104 65" stroke="#16231F" stroke-width="3" fill="none" opacity="0.9"/>
  </g>

  <!-- small earrings -->
  <circle cx="63" cy="112" r="2.6" fill="#FFD37A"/>
  <circle cx="137" cy="112" r="2.6" fill="#FFD37A"/>
</svg>
